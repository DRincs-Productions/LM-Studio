name: Continuous integration

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  desktop-and-coordinator:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/shadow-controller/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install desktop dependencies
        working-directory: apps/shadow-controller
        run: npm ci

      - name: Build desktop frontend
        working-directory: apps/shadow-controller
        run: npm run build

      - name: Check Rust formatting
        run: cargo fmt --manifest-path apps/shadow-controller/coordinator/Cargo.toml -- --check

      - name: Test Coordinator core
        run: cargo test --manifest-path apps/shadow-controller/coordinator/Cargo.toml

      - name: Check Tauri desktop
        run: cargo check --manifest-path apps/shadow-controller/src-tauri/Cargo.toml
