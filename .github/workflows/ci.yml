name: Continuous integration

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  desktop-and-coordinator:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            apps/shadow-controller/package-lock.json
            apps/shadow-client/package-lock.json
            apps/shadow-relay/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install desktop dependencies
        working-directory: apps/shadow-controller
        run: npm ci

      - name: Build desktop frontend
        working-directory: apps/shadow-controller
        run: npm run build

      - name: Install MCP client dependencies
        working-directory: apps/shadow-client
        run: npm ci

      - name: Build MCP client package
        working-directory: apps/shadow-client
        run: npm run build

      - name: Install Cloudflare relay dependencies
        working-directory: apps/shadow-relay
        run: npm ci

      - name: Type-check Cloudflare relay
        working-directory: apps/shadow-relay
        run: npm run build

      - name: Check Rust formatting
        run: cargo fmt --manifest-path apps/shadow-controller/coordinator/Cargo.toml -- --check

      - name: Test Coordinator core
        run: cargo test --manifest-path apps/shadow-controller/coordinator/Cargo.toml

      - name: Check Tauri desktop
        run: cargo check --manifest-path apps/shadow-controller/src-tauri/Cargo.toml

      - name: Build Windows desktop validation executable
        run: cargo build --manifest-path apps/shadow-controller/src-tauri/Cargo.toml

      - name: Upload Windows desktop validation executable
        uses: actions/upload-artifact@v4
        with:
          name: shadow-controller-windows-debug
          path: apps/shadow-controller/src-tauri/target/debug/shadow-controller.exe
          if-no-files-found: error
          retention-days: 7
