<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in to Shadow Controller</title>
    <style>
      body { background: #0b0e17; color: #e8edf8; font: 16px system-ui, sans-serif; margin: 0; min-height: 100vh; display: grid; place-items: center; }
      main { width: min(420px, calc(100vw - 40px)); padding: 32px; border: 1px solid #34334f; border-radius: 14px; background: #111520; }
      h1 { font-size: 22px; } p { color: #a1a9bd; line-height: 1.5; }
      button { background: #7774ed; color: white; border: 0; border-radius: 8px; padding: 12px 16px; font: inherit; cursor: pointer; }
      button:disabled { opacity: .6; cursor: wait; }
      #message { min-height: 24px; margin-top: 16px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Sign in to Shadow Controller</h1>
      <p>Google sign-in opens in your browser. After authentication, return to the client terminal.</p>
      <button id="sign-in" type="button">Continue with Google</button>
      <p id="message" role="status" aria-live="polite"></p>
    </main>
    <script type="module" src="/auth-browser.js"></script>
  </body>
</html>
